name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 14 minutes — just under Render's 15-min sleep threshold
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render backend
        run: |
          echo "Pinging backend health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://skillo-backend-ooyl.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend returned status $STATUS — may be cold-starting"
            # Wait 15s and retry once
            sleep 15
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://skillo-backend-ooyl.onrender.com/health)
            echo "Retry status: $STATUS2"
          fi
